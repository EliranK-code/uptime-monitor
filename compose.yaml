services:
  checker:
    build: .
    command: python checker.py
    environment:
      DB_PATH: /data/monitor.db
      CHECK_INTERVAL: 60
      PYTHONUNBUFFERED: 1
    volumes:
      - uptime-data:/data
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_PATH: /data/monitor.db
    volumes:
      - uptime-data:/data
    restart: unless-stopped

volumes:
  uptime-data: